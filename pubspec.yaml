name: vide
description: "VIDE – AI study companion for university students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-149.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  phosphoricons_flutter: ^1.1.1
  image_picker: ^1.1.2
  photo_manager: ^3.6.3
  camera: ^0.12.2
  cross_file: ^0.3.5+5
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
          weight: 500
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 600

  assets:
    - assets/images/
    - assets/images/icons/
